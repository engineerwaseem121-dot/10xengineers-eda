<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
    <style>
      .box{fill:#ffffff;stroke:#cbd5e1;stroke-width:1.5}
      .step{fill:#0f172a;font-size:12px;font-weight:700;letter-spacing:.5px}
      .t{fill:#0f172a;font-size:16px;font-weight:600}
      .s{fill:#475569;font-size:12.5px}
      .n{fill:#ffffff;font-size:13px;font-weight:700}
      .ln{stroke:#64748b;stroke-width:2;fill:none;marker-end:url(#a)}
      .grp{fill:#f1f5f9;stroke:#e2e8f0}
      .gl{fill:#334155;font-size:13px;font-weight:700}
    </style>
  </defs>
  <rect width="1200" height="560" rx="14" fill="#f8fafc"/>
  <text x="32" y="44" fill="#0f172a" font-size="22" font-weight="700">From one RTL file to a verified block</text>
  <text x="32" y="68" class="s">Every box is one command in VS Code (Ctrl+Shift+P → "DV: …") or one dvflow command in a terminal or CI.</text>

  <!-- row 1 -->
  <g transform="translate(32,96)">
    <rect class="box" width="250" height="118" rx="10"/><circle cx="26" cy="28" r="14" fill="#2563eb"/><text x="26" y="33" text-anchor="middle" class="n">1</text>
    <text x="50" y="33" class="t">Your RTL</text>
    <text x="18" y="62" class="s">adder.sv, fifo.sv, mod10_counter.sv …</text>
    <text x="18" y="82" class="s">DV: Select DUT → ports, clock, reset,</text>
    <text x="18" y="100" class="s">template (counter, FIFO, memory, …)</text>
  </g>
  <g transform="translate(332,96)">
    <rect class="box" width="250" height="118" rx="10"/><circle cx="26" cy="28" r="14" fill="#2563eb"/><text x="26" y="33" text-anchor="middle" class="n">2</text>
    <text x="50" y="33" class="t">Generate</text>
    <text x="18" y="62" class="s">SV testbench · UVM env · cocotb</text>
    <text x="18" y="82" class="s">testplan.yaml + testplan.xlsx</text>
    <text x="18" y="100" class="s">one reference model for all three</text>
  </g>
  <g transform="translate(632,96)">
    <rect class="box" width="250" height="118" rx="10"/><circle cx="26" cy="28" r="14" fill="#2563eb"/><text x="26" y="33" text-anchor="middle" class="n">3</text>
    <text x="50" y="33" class="t">Check Tools</text>
    <text x="18" y="62" class="s">simulators found, versions,</text>
    <text x="18" y="82" class="s">license checkout, UVM, coverage</text>
    <text x="18" y="100" class="s">problems found before the run</text>
  </g>
  <g transform="translate(932,96)">
    <rect class="box" width="236" height="118" rx="10"/><circle cx="26" cy="28" r="14" fill="#2563eb"/><text x="26" y="33" text-anchor="middle" class="n">4</text>
    <text x="50" y="33" class="t">Run</text>
    <text x="18" y="62" class="s">a test, or a regression:</text>
    <text x="18" y="82" class="s">tests × seeds × configs,</text>
    <text x="18" y="100" class="s">each run in its own folder</text>
  </g>
  <path class="ln" d="M282,155 H326"/><path class="ln" d="M582,155 H626"/><path class="ln" d="M882,155 H926"/>

  <!-- simulators group -->
  <rect class="grp" x="632" y="244" width="536" height="96" rx="10"/>
  <text x="648" y="268" class="gl">Runs on</text>
  <g font-size="12.5">
    <rect x="648" y="280" width="248" height="46" rx="8" fill="#ecfdf5" stroke="#86efac"/>
    <text x="662" y="299" fill="#065f46" font-weight="700">Docker image (free, no install)</text>
    <text x="662" y="317" fill="#065f46">Icarus · Verilator + UVM · Yosys · cocotb</text>
    <rect x="908" y="280" width="246" height="46" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="922" y="299" fill="#1e3a8a" font-weight="700">Your installed simulators</text>
    <text x="922" y="317" fill="#1e3a8a">Questa · VCS · local Icarus/Verilator</text>
  </g>
  <path class="ln" d="M1050,214 V238"/>

  <!-- row 2 -->
  <g transform="translate(932,380)">
    <rect class="box" width="236" height="140" rx="10"/><circle cx="26" cy="28" r="14" fill="#16a34a"/><text x="26" y="33" text-anchor="middle" class="n">5</text>
    <text x="50" y="33" class="t">Review</text>
    <text x="18" y="62" class="s">Dashboard: test × seed grid,</text>
    <text x="18" y="82" class="s">log + waveform per run,</text>
    <text x="18" y="102" class="s">code + functional coverage,</text>
    <text x="18" y="122" class="s">Excel plan filled in</text>
  </g>
  <g transform="translate(632,380)">
    <rect class="box" width="250" height="140" rx="10"/><circle cx="26" cy="28" r="14" fill="#dc2626"/><text x="26" y="33" text-anchor="middle" class="n">6</text>
    <text x="50" y="33" class="t">Debug a failure</text>
    <text x="18" y="62" class="s">triage names the output, the</text>
    <text x="18" y="82" class="s">input and the time; waveform</text>
    <text x="18" y="102" class="s">jumps there; X-trace to the line;</text>
    <text x="18" y="122" class="s">rerun with waves, same seed</text>
  </g>
  <g transform="translate(332,380)">
    <rect class="box" width="250" height="140" rx="10"/><circle cx="26" cy="28" r="14" fill="#7c3aed"/><text x="26" y="33" text-anchor="middle" class="n">7</text>
    <text x="50" y="33" class="t">Prove and measure</text>
    <text x="18" y="62" class="s">formal: DUT = spec for every</text>
    <text x="18" y="82" class="s">input; mutation score: would</text>
    <text x="18" y="102" class="s">the tests catch a planted bug?</text>
  </g>
  <g transform="translate(32,380)">
    <rect class="box" width="250" height="140" rx="10"/><circle cx="26" cy="28" r="14" fill="#0f172a"/><text x="26" y="33" text-anchor="middle" class="n">8</text>
    <text x="50" y="33" class="t">Sign off</text>
    <text x="18" y="62" class="s">lint · synthesis (latches, depth)</text>
    <text x="18" y="82" class="s">· equivalence · gate-level sim</text>
    <text x="18" y="102" class="s">· formal, in one checklist:</text>
    <text x="18" y="122" class="s">"is this block done?"</text>
  </g>
  <path class="ln" d="M1050,340 V374"/>
  <path class="ln" d="M932,450 H888"/><path class="ln" d="M632,450 H588"/><path class="ln" d="M332,450 H288"/>
  <path d="M757,380 C757,360 1000,360 1010,374" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#a)"/>
  <text x="820" y="362" fill="#dc2626" font-size="11.5">fix, rerun failed</text>
</svg>
