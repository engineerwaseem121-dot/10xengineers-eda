<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
    <style>
      .box{fill:#ffffff;stroke:#cbd5e1;stroke-width:1.5}
      .dec{fill:#fffbeb;stroke:#fcd34d;stroke-width:1.5}
      .ok{fill:#ecfdf5;stroke:#86efac;stroke-width:1.5}
      .bad{fill:#fef2f2;stroke:#fca5a5;stroke-width:1.5}
      .t{fill:#0f172a;font-size:15px;font-weight:600}
      .s{fill:#475569;font-size:12.5px}
      .y{fill:#15803d;font-size:12px;font-weight:700}
      .no{fill:#b91c1c;font-size:12px;font-weight:700}
      .ln{stroke:#64748b;stroke-width:2;fill:none;marker-end:url(#a)}
    </style>
  </defs>
  <rect width="1200" height="470" rx="14" fill="#f8fafc"/>
  <text x="32" y="44" fill="#0f172a" font-size="22" font-weight="700">What happens when you press Run (Docker mode)</text>
  <text x="32" y="68" class="s">Mode "auto" (default): your own installed tools are used first and Docker fills the gaps. "container" always uses the image; "local" never does.</text>

  <!-- main row -->
  <g transform="translate(32,104)"><rect class="box" width="150" height="82" rx="10"/>
    <text x="16" y="32" class="t">Run</text><text x="16" y="54" class="s">test / regression /</text><text x="16" y="71" class="s">UVM / cocotb</text></g>
  <g transform="translate(222,104)"><rect class="dec" width="170" height="82" rx="10"/>
    <text x="16" y="32" class="t">Docker running?</text><text x="16" y="54" class="s">Docker Desktop, or</text><text x="16" y="71" class="s">Docker Engine in WSL</text></g>
  <g transform="translate(432,104)"><rect class="dec" width="170" height="82" rx="10"/>
    <text x="16" y="32" class="t">Image on disk?</text><text x="16" y="54" class="s">eda-tools:&lt;version&gt;</text><text x="16" y="71" class="s">pinned in the extension</text></g>
  <g transform="translate(642,104)"><rect class="box" width="190" height="82" rx="10"/>
    <text x="16" y="32" class="t">Download once</text><text x="16" y="54" class="s">progress in the Output panel;</text><text x="16" y="71" class="s">Cancel stops it cleanly</text></g>
  <g transform="translate(872,104)"><rect class="box" width="140" height="82" rx="10"/>
    <text x="16" y="32" class="t">Smoke test</text><text x="16" y="54" class="s">every tool tried</text><text x="16" y="71" class="s">in 10–20 s</text></g>
  <g transform="translate(1048,104)"><rect class="ok" width="120" height="82" rx="10"/>
    <text x="16" y="32" class="t">Run tests</text><text x="16" y="54" class="s">project mounted,</text><text x="16" y="71" class="s">same paths</text></g>

  <path class="ln" d="M182,145 H216"/>
  <path class="ln" d="M392,145 H426"/><text x="398" y="137" class="y">yes</text>
  <path class="ln" d="M602,145 H636"/><text x="608" y="137" class="no">no</text>
  <path class="ln" d="M832,145 H866"/>
  <path class="ln" d="M1012,145 H1042"/><text x="1014" y="137" class="y">pass</text>
  <!-- image present: skip straight to run -->
  <path class="ln" d="M517,104 C517,84 1108,84 1108,98"/><text x="740" y="82" class="y">yes: start straight away (later runs)</text>

  <!-- failure row -->
  <g transform="translate(222,250)"><rect class="bad" width="230" height="92" rx="10"/>
    <text x="16" y="28" class="t">Clear message, no run</text><text x="16" y="50" class="s">"Docker is not installed" /</text><text x="16" y="67" class="s">"not running: start it with …" /</text><text x="16" y="84" class="s">"no permission: add your user …"</text></g>
  <path class="ln" d="M307,186 V244"/><text x="314" y="222" class="no">no</text>

  <g transform="translate(560,250)"><rect class="bad" width="272" height="92" rx="10"/>
    <text x="16" y="28" class="t">Download failed</text><text x="16" y="50" class="s">offline / proxy / disk full / image</text><text x="16" y="67" class="s">private: says which, and how to fix;</text><text x="16" y="84" class="s">two windows never download twice</text></g>
  <path class="ln" d="M737,186 V244"/>

  <g transform="translate(872,250)"><rect class="bad" width="296" height="92" rx="10"/>
    <text x="16" y="28" class="t">Smoke test failed</text><text x="16" y="50" class="s">the new image is not used;</text><text x="16" y="67" class="s">the last working image (if any)</text><text x="16" y="84" class="s">is kept and the run uses it</text></g>
  <path class="ln" d="M942,186 V244"/><text x="950" y="222" class="no">fail</text>

  <!-- updates -->
  <g transform="translate(32,370)"><rect class="box" width="1136" height="78" rx="10"/>
    <text x="16" y="26" class="t">Updates</text>
    <text x="16" y="47" class="s">Once a day the extension looks for a newer compatible image (same major version); "10xEngineers EDA: Update Simulation Tools" does it now. A new image is downloaded,</text>
    <text x="16" y="66" class="s">smoke-tested, then used; until then the old one keeps working. Turn off with tenxDebug.toolchain.autoUpdate = false. The status bar shows the image tag and tool versions.</text>
  </g>
</svg>
