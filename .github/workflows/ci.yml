name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Syntax, JSON and unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax check every JavaScript file
        shell: bash
        run: |
          set -e
          n=0
          while IFS= read -r f; do node --check "$f"; n=$((n+1)); done < <(git ls-files '*.js')
          echo "$n files OK"
      - name: Validate JSON (package.json, grammars, snippets, schemas)
        shell: bash
        run: |
          node -e '
            const fs = require("fs"), cp = require("child_process");
            const files = cp.execSync("git ls-files \"*.json\"").toString().trim().split("\n");
            for (const f of files) {
              const txt = fs.readFileSync(f, "utf8").replace(/^﻿/, "");
              // language-configuration files may contain comments (JSONC)
              JSON.parse(/language-configuration/.test(f) ? txt.replace(/\/\/.*$/gm, "") : txt);
            }
            const p = require("./package.json");
            if (!p.name || !p.version || !p.publisher || !p.engines || !p.engines.vscode) throw new Error("package.json is missing name/version/publisher/engines");
            if ((p.keywords || []).length > 30) throw new Error("the Marketplace allows at most 30 keywords");
            console.log(files.length + " JSON files OK; " + p.displayName + " " + p.version);
          '
      - name: Unit tests
        run: node test/unit.js

  e2e:
    name: End-to-end flow with Icarus (generate → regression → Excel test plan)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Icarus Verilog
        run: sudo apt-get update -qq && sudo apt-get install -y -qq iverilog
      - name: Generate every testbench from the demo adder
        run: |
          mkdir -p "$RUNNER_TEMP/demo"
          cp examples/demo/adder.sv "$RUNNER_TEMP/demo/"
          node src/dv/cli.js init --file "$RUNNER_TEMP/demo/adder.sv" --root "$RUNNER_TEMP/demo"
          test -f "$RUNNER_TEMP/demo/testplan.yaml"
          test -f "$RUNNER_TEMP/demo/testplan.xlsx"   # the Excel plan is created with the YAML plan
      - name: Run a regression over seed range 1:3 (auto mode uses the local Icarus)
        run: node src/dv/cli.js regress --sim icarus --suite full --seeds 1:3 --root "$RUNNER_TEMP/demo"
      - name: Upload the dashboard and test plan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-regression
          path: |
            ${{ runner.temp }}/demo/testplan.*
            ${{ runner.temp }}/demo/runs/
          if-no-files-found: warn

  package:
    name: Package the .vsix
    runs-on: windows-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - name: Build
        shell: pwsh
        run: ./build-vsix.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: dist/*.vsix

  release:
    name: GitHub Release (on version tags)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [check, e2e, package]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vsix
          path: dist
      - name: Create the release with the .vsix attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.vsix --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
