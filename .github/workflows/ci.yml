name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # only used by the release step on v* tags

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Syntax check
        run: git ls-files '*.js' | xargs -n1 node --check

      - name: Unit tests
        run: node test/unit.js

      - name: End-to-end (Icarus) — generate, regress, Excel test plan
        run: |
          sudo apt-get install -y -qq iverilog
          d="$RUNNER_TEMP/demo"; mkdir -p "$d"; cp examples/demo/adder.sv "$d/"
          node src/dv/cli.js init --file "$d/adder.sv" --root "$d"
          test -f "$d/testplan.xlsx"
          node src/dv/cli.js regress --sim icarus --suite full --seeds 1:2 --root "$d"

      - name: Package .vsix
        shell: pwsh
        run: ./build-vsix.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: dist/*.vsix

      - name: Release (on v* tags)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.vsix --title "$GITHUB_REF_NAME" --generate-notes

  # Docker image: build + smoke test when container/ changes (no push; publishing is publish-image.yml)
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Did container/ change?
        id: chg
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || git diff --name-only HEAD~1 HEAD | grep -q '^container/'; then echo "run=1" >> "$GITHUB_OUTPUT"; else echo "run=0" >> "$GITHUB_OUTPUT"; fi
      - name: Build image
        if: steps.chg.outputs.run == '1'
        run: |
          V=$(node -p "require('./container/image.json').version")
          docker build -t eda-tools:ci --build-arg IMAGE_VERSION="$V" container
      - name: Smoke test
        if: steps.chg.outputs.run == '1'
        run: docker run --rm eda-tools:ci tenx-smoke
